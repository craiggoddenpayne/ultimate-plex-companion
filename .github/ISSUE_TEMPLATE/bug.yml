name: Bug report
description: Report reproducible unexpected behavior
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include a Plex token, private media path or sensitive screenshot.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include what you expected and what actually occurred.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose, Docker, Local Node.js, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
