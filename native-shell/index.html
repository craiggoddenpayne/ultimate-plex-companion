<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Ultimate Plex Companion</title>
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        color: #f4f3ef;
        background: #080a0f;
        font: 16px system-ui;
      }
      main {
        max-width: 420px;
        padding: 32px;
        text-align: center;
      }
      i {
        display: block;
        width: 44px;
        height: 44px;
        margin: 0 auto 24px;
        border: 1px solid #f5ad2e;
        transform: rotate(45deg);
        box-shadow: 0 0 28px #f5ad2e55;
      }
      p {
        color: #818895;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <i></i>
      <h1>Ultimate Plex Companion</h1>
      <p>
        The native client could not load its configured Companion server. Check the server address and network
        connection, then reopen the app.
      </p>
    </main>
  </body>
</html>
